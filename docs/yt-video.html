<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CHEESE EYES · YouTube Video Relay</title>
<!--
  오류 153(동영상 플레이어 구성 오류)의 실제 원인은 임베드하는 페이지가
  유튜브로 보내는 Referer가 비어있거나 신뢰할 수 없을 때 발생한다.
  chrome-extension:// 페이지에서 iframe으로 직접 https://www.youtube.com/embed/...
  를 열면 이 경우에 해당한다. 이 페이지는 실제 https 도메인 위에서 그
  iframe을 대신 열어주기만 해서, 유튜브가 정상적인 Referer/origin을
  받도록 한다. (yt-chat.html과 동일한 이유의 중계 페이지)
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-src https://www.youtube.com; base-uri 'none'; object-src 'none'" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .cheese-relay-error {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%; color: #aaa; font: 13px -apple-system, sans-serif;
  }
</style>
</head>
<body>
<script>
  (function () {
    var YT_VIDEO_ID_RE = /^[a-zA-Z0-9_-]{11}$/;
    var params = new URLSearchParams(location.search);
    var videoId = params.get('v');
    var channel = params.get('channel');
    var autoplay = params.get('autoplay') !== '0';
    var origin = encodeURIComponent(location.origin);

    var src = null;
    if (videoId && YT_VIDEO_ID_RE.test(videoId)) {
      src = 'https://www.youtube.com/embed/' + encodeURIComponent(videoId) +
        '?autoplay=' + (autoplay ? '1' : '0') + '&origin=' + origin;
    } else if (channel) {
      src = 'https://www.youtube.com/embed/live_stream?channel=' + encodeURIComponent(channel) +
        '&autoplay=' + (autoplay ? '1' : '0') + '&origin=' + origin;
    }

    if (!src) {
      var errEl = document.createElement('div');
      errEl.className = 'cheese-relay-error';
      errEl.textContent = 'Invalid or missing video/channel id';
      document.body.appendChild(errEl);
      return;
    }

    var iframe = document.createElement('iframe');
    iframe.src = src;
    iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture');
    iframe.setAttribute('allowfullscreen', '');
    document.body.appendChild(iframe);
  })();
</script>
</body>
</html>
