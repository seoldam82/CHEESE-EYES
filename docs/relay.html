<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CHEESE EYES · YouTube Relay</title>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://i.ytimg.com https://*.ytimg.com; frame-src https://www.youtube.com; base-uri 'none'; object-src 'none'" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0f0f0f; overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .cheese-relay-error {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%; color: #aaa; font: 13px -apple-system, sans-serif;
  }
</style>
</head>
<body>
<script>
  (function () {
    var YT_VIDEO_ID_RE = /^[a-zA-Z0-9_-]{11}$/;
    var params = new URLSearchParams(location.search);
    var type = params.get('type');

    function showError(msg) {
      var errEl = document.createElement('div');
      errEl.className = 'cheese-relay-error';
      errEl.textContent = msg;
      document.body.appendChild(errEl);
    }

    function mountIframe(src, allow, extra) {
      var iframe = document.createElement('iframe');
      iframe.src = src;
      if (allow) iframe.setAttribute('allow', allow);
      if (extra) {
        Object.keys(extra).forEach(function (k) { iframe.setAttribute(k, extra[k]); });
      }
      document.body.appendChild(iframe);
      return iframe;
    }

    function renderVideo() {
      var videoId = params.get('v');
      var channel = params.get('channel');
      var autoplay = params.get('autoplay') !== '0';
      var origin = encodeURIComponent(location.origin);
      // 새로고침/재추가로 이 프레임이 다시 만들어질 때, dashboard.js가
      // 기억해둔 마지막 재생 위치를 실어 보내면 처음(0초)이 아니라 거기서
      // 이어서 재생된다(§ CHANNEL_PLAYBACK_TIME 아래).
      var startSec = params.get('start');

      var src = null;
      // cc_load_policy=0: 시청자가 직접 켜지 않는 한 자막을 기본으로 끈
      // 상태로 시작한다(§ 영상 추가 시 자막 비활성화).
      if (videoId && YT_VIDEO_ID_RE.test(videoId)) {
        src = 'https://www.youtube.com/embed/' + encodeURIComponent(videoId) +
          '?autoplay=' + (autoplay ? '1' : '0') +
          (autoplay ? '&mute=1' : '') +
          '&cc_load_policy=0' +
          (startSec ? '&start=' + encodeURIComponent(startSec) : '') +
          '&enablejsapi=1' +
          '&origin=' + origin;
      } else if (channel) {
        src = 'https://www.youtube.com/embed/live_stream?channel=' + encodeURIComponent(channel) +
          '&autoplay=' + (autoplay ? '1' : '0') +
          (autoplay ? '&mute=1' : '') +
          '&cc_load_policy=0' +
          '&enablejsapi=1' +
          '&origin=' + origin;
      }

      if (!src) { showError('Invalid or missing video/channel id'); return; }

      document.body.style.background = '#000';
      var ytFrame = mountIframe(
        src,
        'autoplay; fullscreen; encrypted-media; picture-in-picture',
        { allowfullscreen: '' }
      );

      // [CHEESE EYES] 이 페이지(relay.html)는 대시보드와 실제 유튜브 embed
      // 프레임 사이에 한 겹 끼어 있다. content.js는 안쪽 유튜브 embed
      // 프레임에 주입되는데, 대시보드 쪽 videoWrapperMap은 relay.html
      // 자신(직계 iframe)만 참조를 들고 있어서 안쪽 프레임과는 직접
      // postMessage를 주고받을 수 없다(교차 출처라 DOM으로 접근도 불가).
      // 그래서 오디오 측정(dB 파형/합방 겹침 디버그, §docs/audio-architecture.md)에
      // 필요한 메시지는 양방향으로 이 페이지가 중계해준다 — content.js는
      // window.parent로(=이 페이지로) 보내고, 이 페이지가 다시 그대로
      // window.parent(대시보드)로 올려보낸다. 반대로 대시보드가 보내는
      // 원본 SET_CHANNEL_VOLUME/SET_CHANNEL_CAPTURE/REQUEST_AUDIO_SNIPPET도
      // 그대로 안쪽 프레임까지 전달해준다. event.source로 방향을 구분해서
      // 엉뚱한 곳에서 온 메시지가 릴레이되지 않게 한다.
      var RELAY_UP_TYPES = ['CHANNEL_AUDIO_LEVEL', 'CHANNEL_AUDIO_SNIPPET', 'USER_VOLUME_CHANGE', 'CHANNEL_LIVE_LATENCY', 'CHANNEL_VIDEO_ENDED', 'CHANNEL_PLAYBACK_TIME'];
      var RELAY_DOWN_TYPES = ['SET_CHANNEL_VOLUME', 'SET_CHANNEL_CAPTURE', 'REQUEST_AUDIO_SNIPPET'];
      window.addEventListener('message', function (e) {
        var data = e.data;
        if (!data || typeof data !== 'object') return;
        if (e.source === ytFrame.contentWindow && RELAY_UP_TYPES.indexOf(data.type) !== -1) {
          window.parent.postMessage(data, '*');
        } else if (e.source === window.parent && RELAY_DOWN_TYPES.indexOf(data.type) !== -1) {
          ytFrame.contentWindow.postMessage(data, '*');
        }
      });

      // [CHEESE EYES] 크로스오리진 iframe에서는 브라우저 자동재생 정책 때문에
      // mute=1 없이는 애초에 재생 자체가 거부돼서, 위에서 항상 음소거 상태로
      // 먼저 재생을 시작한다. 문제는 그 다음이었다: 대시보드(부모) 쪽에서
      // 모든 채널의 버퍼링이 끝나면 이 창(relay.html)으로 SET_VOLUME/PLAY
      // 동기화 메시지를 보내는데, 이 페이지에는 그 메시지를 처리하는 리스너가
      // 전혀 없었고 & enablejsapi=1도 빠져 있어서 실제 유튜브 플레이어(안쪽
      // iframe)에 명령을 보낼 수도 없었다. 그래서 채널을 아무리 기다려도
      // 영원히 음소거 상태로 남아있었다. 아래에서 (1) enablejsapi=1을 추가하고
      // (2) 부모가 보내는 신호를 유튜브 IFrame Player API의 공식 명령
      // (unMute/setVolume/playVideo)으로 안쪽 iframe에 릴레이하고 (3) 신호가
      // 유실되거나 플레이어 초기화 타이밍과 어긋나는 경우에 대비해 로드 후
      // 스스로 몇 차례 재시도한다.
      function sendYtCommand(func, args) {
        try {
          ytFrame.contentWindow.postMessage(
            JSON.stringify({ event: 'command', func: func, args: args || [] }),
            'https://www.youtube.com'
          );
        } catch (e) {}
      }

      // [CHEESE EYES] 엔딩화면(추천 영상)에서 다른 영상을 클릭하면, 이
      // iframe이 그 영상을 그대로 이어서 재생한다(새로 embed되는 게 아님).
      // enablejsapi=1이 있으면 유튜브 IFrame Player API가 이 프레임(부모)
      // 으로 표준 postMessage 프로토콜(문자열 JSON)을 보내주는데, "listening"
      // 핸드셰이크를 먼저 보내야 그 뒤로 infoDelivery 이벤트가 오기
      // 시작한다. infoDelivery.info.videoData.video_id가 우리가 원래 넣어준
      // videoId와 달라지면 사용자가 추천 영상을 클릭(또는 자동 다음 재생)한
      // 것으로 보고 대시보드에 알려서 이 슬롯을 새 영상으로 바꿔 끼우게
      // 한다(§dashboard.js handleVodVideoChanged).
      var loadedVideoId = videoId;
      window.addEventListener('message', function (e) {
        if (e.source !== ytFrame.contentWindow || typeof e.data !== 'string') return;
        var msg;
        try { msg = JSON.parse(e.data); } catch (err) { return; }
        if (!msg || msg.event !== 'infoDelivery' || !msg.info || !msg.info.videoData) return;
        var vd = msg.info.videoData;
        if (!vd.video_id || vd.video_id === loadedVideoId) return;
        loadedVideoId = vd.video_id;
        window.parent.postMessage({
          type: 'CHANNEL_VIDEO_CHANGED',
          videoId: vd.video_id,
          title: vd.title || '',
          author: vd.author || ''
        }, '*');
      });
      ytFrame.addEventListener('load', function () {
        sendYtCommand('addEventListener', ['onStateChange']);
        try {
          ytFrame.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'cheese-eyes' }), 'https://www.youtube.com');
        } catch (e) {}
      });

      // [CHEESE EYES] content.js(안쪽 유튜브 embed 페이지 자체에 주입됨)가
      // 엔딩화면/영상 카드 클릭을 가로채(새 탭으로 열리는 것을 막고) 이
      // 프레임으로 클릭된 영상ID를 알려준다 — loadVideoById로 같은
      // iframe에서 이어서 재생한다. 그러면 위 infoDelivery 리스너가
      // video_id 변경을 감지해 대시보드에 자동으로 알린다.
      window.addEventListener('message', function (e) {
        var data = e.data;
        if (e.source !== ytFrame.contentWindow || !data || typeof data !== 'object') return;
        if (data.type === 'CHEESE_YT_SUGGESTION_CLICKED' && data.videoId) {
          sendYtCommand('loadVideoById', [data.videoId]);
        }
      });

      // [CHEESE EYES] 댓글 안의 타임스탬프(예: 1:57) 클릭 시 이 채널을 그
      // 지점으로 이동시킨다(§dashboard.js seekYoutubeChannelTo).
      window.addEventListener('message', function (e) {
        var data = e.data;
        if (e.source !== window.parent || !data || typeof data !== 'object') return;
        if (data.type === 'SEEK_TO_TIME' && typeof data.seconds === 'number') {
          sendYtCommand('seekTo', [data.seconds, true]);
          sendYtCommand('playVideo');
        }
      });

      if (!autoplay) return;

      var lastVolume = 100;

      function unmuteAndPlay() {
        sendYtCommand('unMute');
        sendYtCommand('setVolume', [lastVolume]);
        sendYtCommand('playVideo');
      }

      // [CHEESE EYES] cc_load_policy=0(위 src)는 "기본값 힌트"일 뿐이라,
      // 시청자의 유튜브 계정 자체에 자막 자동 표시 설정이 켜져 있으면
      // 무시되고 자막이 뜬다 — 채널 추가 직후 원치 않는 자막이 보이는
      // 원인. unloadModule('captions')를 명령으로 직접 보내면 계정 설정과
      // 무관하게 자막 렌더링 모듈 자체를 내려서 확실히 끌 수 있다.
      function disableCaptions() {
        sendYtCommand('unloadModule', ['captions']);
      }

      // 대시보드(조상 프레임)에서 오는 동기화 신호를 실제 유튜브 플레이어
      // 명령으로 릴레이한다.
      window.addEventListener('message', function (e) {
        var data = e.data;
        if (!data || typeof data !== 'object') return;
        if (data.type === 'SET_VOLUME') {
          unmuteAndPlay();
        } else if (data.type === 'PLAY') {
          sendYtCommand('playVideo');
        } else if (data.type === 'SET_CHANNEL_VOLUME') {
          var vol = Math.min(100, Math.max(0, Number(data.volume) || 0));
          lastVolume = vol;
          sendYtCommand('setVolume', [vol]);
          // [CHEESE EYES] 여기서 vol<=0일 때 유튜브 네이티브 mute()까지 걸면
          // 플레이어 내부 디코딩 자체가 멈춰서, content.js가 gainNode 이전
          // 지점(§ensureAudioGraph)에서 재는 dB 측정까지 같이 죽어버린다 —
          // 합방 겹침으로 볼륨이 0%가 됐다가 다시 올라와도 측정이 영영 안
          // 살아나는 원인이었다. 실제 무음 처리는 content.js가 gainNode(그래프
          // 활성 시) 또는 video.muted(폴백 시)로 이미 알아서 하므로, 여기서는
          // 항상 unMute만 유지해 디코딩 자체는 끊기지 않게 한다.
          sendYtCommand('unMute');
        }
      });

      // 부모 신호가 늦게 도착하거나(플레이어가 아직 명령을 받을 준비가 안 된
      // 상태) 유실되는 경우를 대비해, 로드 후 스스로도 몇 차례 언뮤트를
      // 시도한다.
      ytFrame.addEventListener('load', function () {
        var attempts = 0;
        var retryTimer = setInterval(function () {
          attempts++;
          unmuteAndPlay();
          disableCaptions();
          if (attempts >= 5) clearInterval(retryTimer);
        }, 700);
      });
    }

    function renderChat() {
      var videoId = params.get('v');
      var dark = params.get('dark') !== '0';

      if (!videoId || !YT_VIDEO_ID_RE.test(videoId)) {
        showError('Invalid or missing video id');
        return;
      }

      var chatUrl = 'https://www.youtube.com/live_chat?v=' + encodeURIComponent(videoId) +
        '&embed_domain=' + encodeURIComponent(location.hostname) +
        (dark ? '&dark_theme=1' : '');

      mountIframe(chatUrl, 'autoplay; encrypted-media', { scrolling: 'no' });
    }

    function renderProxy() {
      var videoId = params.get('v');
      var origin = encodeURIComponent(location.origin);

      if (!videoId || !YT_VIDEO_ID_RE.test(videoId)) {
        showError('Invalid or missing video id');
        return;
      }

      var src = 'https://www.youtube.com/embed/' + encodeURIComponent(videoId) +
        '?autoplay=0&controls=0&origin=' + origin;

      mountIframe(src, null, { name: 'cheese-eyes-yt-proxy' });
    }

    if (type === 'chat') {
      renderChat();
    } else if (type === 'video') {
      renderVideo();
    } else if (type === 'proxy') {
      renderProxy();
    } else {
      showError('Missing "type" parameter (expected type=video, type=chat, or type=proxy)');
    }
  })();
</script>
</body>
</html>
