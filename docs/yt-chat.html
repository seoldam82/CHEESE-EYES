<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CHEESE EYES · YouTube Chat Relay</title>
<!--
  이 페이지의 유일한 목적: 유튜브 live_chat 임베드가 요구하는
  "실제 https 도메인" 위에서 embed_domain 파라미터를 정직하게 채워
  요청을 보내는 것뿐입니다. chrome-extension:// 오리진에서는 이
  embed_domain 검증을 통과할 방법이 없어(ERR_BLOCKED_BY_RESPONSE),
  CHEESE EYES 확장이 이 페이지를 iframe으로 감싸 우회 없이 정상
  임베드 경로를 타도록 합니다. 헤더/오리진 위조가 아니라, 우리가
  소유한 진짜 도메인에서 진짜로 요청을 보내는 것입니다.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-src https://www.youtube.com; base-uri 'none'; object-src 'none'" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0f0f0f; overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .cheese-relay-error {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%; color: #aaa; font: 13px -apple-system, sans-serif;
  }
</style>
</head>
<body>
<script>
  (function () {
    var YT_VIDEO_ID_RE = /^[a-zA-Z0-9_-]{11}$/;
    var params = new URLSearchParams(location.search);
    var videoId = params.get('v');
    var dark = params.get('dark') !== '0';

    if (!videoId || !YT_VIDEO_ID_RE.test(videoId)) {
      var errEl = document.createElement('div');
      errEl.className = 'cheese-relay-error';
      errEl.textContent = 'Invalid or missing video id';
      document.body.appendChild(errEl);
      return;
    }

    var iframe = document.createElement('iframe');
    var chatUrl = 'https://www.youtube.com/live_chat?v=' + encodeURIComponent(videoId) +
      '&embed_domain=' + encodeURIComponent(location.hostname) +
      (dark ? '&dark_theme=1' : '');
    iframe.src = chatUrl;
    iframe.setAttribute('allow', 'autoplay; encrypted-media');
    iframe.setAttribute('scrolling', 'no');
    document.body.appendChild(iframe);
  })();
</script>
</body>
</html>
