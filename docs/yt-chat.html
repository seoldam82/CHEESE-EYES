<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="frame-src https://www.youtube.com; default-src 'self'">
  <style>html,body,iframe{margin:0;padding:0;width:100%;height:100%;border:0;}</style>
</head>
<body>
  <script>
    const params = new URLSearchParams(location.search);
    const videoId = params.get('v');
    if (videoId && /^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
      const iframe = document.createElement('iframe');
      iframe.src = `https://www.youtube.com/live_chat?v=${videoId}&embed_domain=seoldam82.github.io&dark_theme=1`;
      document.body.appendChild(iframe);
    }
  </script>
</body>
</html>
